# acd-managed: true
hooks:
  - id: acd-start
    event: session.created
    actions:
      - bash: |
          acd internal integration event \
            --harness pi \
            --event session_open \
            --session-id "${PI_SESSION_ID:-}" \
            --watch-pid "$PPID" \
            --repo "$PI_PROJECT_DIR"

  - id: acd-wake-tool-before
    event: tool.before.*
    actions:
      - bash: |
          acd internal integration event \
            --harness pi \
            --event activity \
            --session-id "${PI_SESSION_ID:-}" \
            --watch-pid "$PPID" \
            --repo "$PI_PROJECT_DIR"

  - id: acd-wake-tool-after
    event: tool.after.*
    actions:
      - bash: |
          acd internal integration event \
            --harness pi \
            --event activity \
            --session-id "${PI_SESSION_ID:-}" \
            --watch-pid "$PPID" \
            --repo "$PI_PROJECT_DIR"

  - id: acd-flush-idle
    event: session.idle
    actions:
      - bash: |
          acd internal integration event \
            --harness pi \
            --event logical_boundary \
            --session-id "${PI_SESSION_ID:-}" \
            --watch-pid "$PPID" \
            --repo "$PI_PROJECT_DIR"

  - id: acd-stop
    event: session.deleted
    actions:
      - bash: |
          acd internal integration event \
            --harness pi \
            --event session_close \
            --session-id "${PI_SESSION_ID:-}" \
            --watch-pid "$PPID" \
            --repo "$PI_PROJECT_DIR"
