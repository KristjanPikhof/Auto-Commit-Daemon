# acd-managed: true
hooks:
  - id: acd-start
    event: session.created
    actions:
      - bash: |
          SID="${PI_SESSION_ID:-unknown}"
          acd start \
            --session-id "$SID" \
            --harness pi \
            --watch-pid "$PPID" \
            --repo "$PI_PROJECT_DIR"

  - id: acd-wake-tool-before
    event: tool.before.*
    actions:
      - bash: |
          SID="${PI_SESSION_ID:-unknown}"
          acd start \
            --session-id "$SID" \
            --harness pi \
            --watch-pid "$PPID" \
            --repo "$PI_PROJECT_DIR"
          acd wake \
            --session-id "$SID" \
            --repo "$PI_PROJECT_DIR"

  - id: acd-wake-tool-after
    event: tool.after.*
    actions:
      - bash: |
          SID="${PI_SESSION_ID:-unknown}"
          acd start \
            --session-id "$SID" \
            --harness pi \
            --watch-pid "$PPID" \
            --repo "$PI_PROJECT_DIR"
          acd wake \
            --session-id "$SID" \
            --repo "$PI_PROJECT_DIR"

  - id: acd-touch-idle
    event: session.idle
    actions:
      - bash: |
          SID="${PI_SESSION_ID:-unknown}"
          acd touch \
            --session-id "$SID" \
            --repo "$PI_PROJECT_DIR"

  - id: acd-stop
    event: session.deleted
    actions:
      - bash: |
          SID="${PI_SESSION_ID:-unknown}"
          acd stop \
            --session-id "$SID" \
            --repo "$PI_PROJECT_DIR"
