name: ci

on:
  push:
    branches: [main]
  pull_request:

# Default permissions for all jobs: read-only on contents. Individual jobs
# may widen this; reading-only by default reduces blast radius if a third-
# party action is ever compromised before SHA pins update.
permissions:
  contents: read

env:
  GO_VERSION: '1.26.6'

jobs:
  test:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # All actions are pinned to a 40-char commit SHA. The `# vN.M.P`
      # comment is the human-readable tag the SHA was resolved from at
      # pin time. Renovate / Dependabot can update both atomically.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: make lint
      - run: make test
      - run: make build

  race-sensitive:
    # Wall-clock-sensitive tests still run with the race detector, but once
    # and without competing stress shards. Resource starvation otherwise
    # tests runner load instead of the timeout behavior under test.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: race + count=1 on timing-sensitive daemon tests
        run: |
          go test ./internal/daemon/... -race -count=1 -timeout 5m \
            -run 'TestRun_(FsnotifyDrivesWake|LifecycleHappyPath|WakeBurstCoalesced|RealSIGUSR1|RepeatedEditsToSameFile_OrderedCommits|SelfTerminateNoClients)|TestReplay_IntentSingletonSupersededProbeTimeoutSettlesEvent'

  race-stress-daemon:
    # Runner-level shards preserve three complete repetitions without making
    # Git and SQLite processes compete inside one small hosted runner.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    name: race-stress (daemon ${{ matrix.shard }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: race + count=3 daemon shard
        env:
          ACD_TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          scripts/dev/test-package-shards.sh ./internal/daemon 4 \
            -race -count=3 -timeout 10m -failfast \
            -skip 'TestRun_(FsnotifyDrivesWake|LifecycleHappyPath|WakeBurstCoalesced|RealSIGUSR1|RepeatedEditsToSameFile_OrderedCommits|SelfTerminateNoClients)|TestReplay_IntentSingletonSupersededProbeTimeoutSettlesEvent'

  race-stress-support:
    permissions:
      contents: read
    name: race-stress (git and state)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: race + count=3 support packages
        run: |
          go test ./internal/git/... ./internal/state/... \
            -race -count=3 -timeout 10m -failfast

  race-stress:
    permissions:
      contents: read
    if: ${{ always() }}
    needs: [race-sensitive, race-stress-daemon, race-stress-support]
    runs-on: ubuntu-latest
    steps:
      - name: Require every race lane
        env:
          SENSITIVE_RESULT: ${{ needs.race-sensitive.result }}
          DAEMON_RESULT: ${{ needs.race-stress-daemon.result }}
          SUPPORT_RESULT: ${{ needs.race-stress-support.result }}
        run: |
          test "$SENSITIVE_RESULT" = success
          test "$DAEMON_RESULT" = success
          test "$SUPPORT_RESULT" = success

  govulncheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run govulncheck
        run: go tool govulncheck ./...
