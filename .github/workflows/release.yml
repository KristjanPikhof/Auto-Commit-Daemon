name: release

on:
  push:
    tags:
      - 'v*'

# Default to read; the goreleaser job widens to contents: write because it
# needs to publish release artifacts. Pinning every action to a 40-char
# commit SHA prevents a hostile force-push to a moving major-version tag
# (`@v5`, `@v6`) from injecting code into a release pipeline that holds
# secrets.GORELEASER_TOKEN-equivalent privileges.
permissions:
  contents: read

env:
  GO_VERSION: '1.26.6'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - name: Smoke test published install script
        env:
          ACD_INSTALL_DIR: ${{ runner.temp }}/acd-smoke-bin
          ACD_VERSION: ${{ github.ref_name }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if bash scripts/install.sh; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              exit 1
            fi
            echo "install smoke failed; retrying after release asset propagation (attempt $attempt/6)"
            sleep 10
          done
          "$ACD_INSTALL_DIR/acd" version
