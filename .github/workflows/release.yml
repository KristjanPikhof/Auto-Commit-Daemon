name: release

on:
  push:
    tags:
      - 'v*'

# Default to read; the goreleaser job widens to contents: write because it
# needs to publish release artifacts. Pinning every action to a 40-char
# commit SHA prevents a hostile force-push to a moving major-version tag
# (`@v5`, `@v6`) from injecting code into a release pipeline that holds
# secrets.GORELEASER_TOKEN-equivalent privileges.
permissions:
  contents: read

env:
  GO_VERSION: '1.26.4'

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - name: Smoke test published install script
        env:
          ACD_INSTALL_DIR: ${{ runner.temp }}/acd-smoke-bin
          ACD_VERSION: ${{ github.ref_name }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if bash scripts/install.sh; then
              break
            fi
            if [ "$attempt" = "6" ]; then
              exit 1
            fi
            echo "install smoke failed; retrying after release asset propagation (attempt $attempt/6)"
            sleep 10
          done
          "$ACD_INSTALL_DIR/acd" version
