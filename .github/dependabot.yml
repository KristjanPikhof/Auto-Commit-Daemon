# Workflow actions in .github/workflows/ are pinned to 40-char commit SHAs with
# a trailing `# vN.M.P` comment (see ci.yml). Dependabot updates the SHA and
# comment together when bumping github-actions dependencies.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
